description: >-
  First-party client libraries for building on Tlon's Urbit applications. The
  developer surface is the Urbit ship HTTP API (Eyre channels); these TypeScript
  libraries wrap it. @tloncorp/api is the high-level client for Tlon Messenger
  data (groups, channels, contacts, activity); @urbit/http-api is the low-level
  channel client for any Urbit ship; @tloncorp/mock-http-api mocks a ship for tests.
