aid: tlon-corporation
name: Tlon Corporation
description: >-
  Tlon Corporation builds Tlon Messenger, a self-owned, self-hosted social
  messaging app that runs on the user's own Urbit ship, and Tlon Hosting, which
  runs managed ships under tlon.network. Every account ships with Tlonbot, an
  OpenClaw-powered AI agent. Developers integrate through the Urbit ship HTTP API
  (Eyre channels) using the @tloncorp/api and @urbit/http-api TypeScript clients,
  and through the first-party Tlon MCP Server that exposes messaging, groups,
  channels, and profile tools to agents. Backed by a16z.
